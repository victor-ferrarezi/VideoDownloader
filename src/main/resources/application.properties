# Comando que chama o yt-dlp (separado por virgula)
# Windows com Python: py,-m,yt_dlp
# yt-dlp instalado direto (winget, brew...): yt-dlp
app.ytdlp.command=py,-m,yt_dlp

# Pasta TEMPORARIA onde o servidor guarda o arquivo ate entrega-lo ao navegador
app.ytdlp.downloads-dir=Downloads

# Banco de dados H2 (arquivo local em ./data/historico.mv.db)
spring.datasource.url=jdbc:h2:file:./data/historico
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false